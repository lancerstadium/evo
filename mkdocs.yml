site_name: Evo - Evolvable Inference Framework
site_url: https://lancerstadium.github.io/evo/
repo_url: https://github.com/lancerstadium/evo
markdown_extensions:
  - attr_list
  - admonition
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
theme:
  language: zh
  name: material
  logo: public/logo-bare-white.svg
  favicon: public/logo-bare.svg
  features:
    - navigation.tabs
    - content.code.copy
    - content.code.annotate